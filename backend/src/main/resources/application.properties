spring.application.name=mailops-ai

# ---------- Database ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mailops}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---------- AI ----------
ai.mode=${AI_MODE:OPENAI}
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.confidence-threshold=${CONFIDENCE_THRESHOLD:0.85}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---------- Seeding ----------
app.seed.enabled=${SEED_ENABLED:true}

# ---------- Server ----------
server.port=${SERVER_PORT:8080}

# ---------- Logging ----------
logging.level.com.mailops=INFO
logging.level.org.hibernate.SQL=WARN
